<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounding Decimals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rounding Decimals</h1>

        <div id="start-screen" class="screen active">
            <h2>B7.1.1.1.4: Round Decimals to Tenths, Hundredths, Thousandths...</h2>
            <p>Round the decimal number to the specified place value.</p>
            <p>There are 10 questions.</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="question-number">Question 1/10</h2>
            <p id="instruction-text"></p>
            <p id="decimal-to-round" class="decimal-display"></p>
            <div id="options-container" class="options-grid"></div>
        </div>

        <div id="game-over-screen" class="screen">
            <h2>Game Over! 🥳</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
